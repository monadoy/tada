# Builds the documentation site in website/ and publishes it with GitHub Pages.
#
# One-time setup by a repository admin: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is then served at https://<owner>.github.io/<repository>/. For a custom domain, set the repository
# variable DOCS_SITE_URL (Settings -> Secrets and variables -> Actions -> Variables) to the full address,
# ending in a slash.
#
# Pull requests that touch the site are built with the same strict checks but are not published.
name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install MkDocs
        run: python -m pip install -r website/requirements.txt
      - name: Build the site
        working-directory: website
        env:
          SITE_URL: ${{ vars.DOCS_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: mkdocs build --strict
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
