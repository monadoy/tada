site_name: TADA · RL for arrival management
site_description: "Single- and multi-agent reinforcement learning for time-based arrival management at Milan Malpensa (trombone) and Milan Bergamo (point merge): design, results and a lab to fly the published agents"
# The published address. The deployment workflow sets SITE_URL; a local build or preview leaves it empty.
site_url: !ENV [SITE_URL, ""]
repo_url: https://github.com/monadoy/tada
repo_name: monadoy/tada
edit_uri: ""
docs_dir: docs
copyright: "Research software and models, shared as is. Developed within TADA (SESAR 3 JU, grant agreement No 101166972)."

theme:
  name: material
  custom_dir: overrides
  font: false
  icon:
    logo: material/airplane-landing
    repo: material/github
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/tada-components.css
  - stylesheets/theme.css
  - stylesheets/nav.css
  - stylesheets/site.css
  - stylesheets/lab.css

extra_javascript:
  - javascripts/tada.js
  - javascripts/key-request.js
  - javascripts/lab-engine.js
  - javascripts/lab.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Results: results.md
  - How it works:
      - how/index.md
      - The problem: how/problem.md
      - Episodes and windowing: how/environments.md
      - Observations: how/observations.md
      - Actions and reselection: how/actions.md
      - Policy network: how/policy.md
      - Objective and reward: how/objective.md
      - Separation rules: how/separation.md
      - Rollout search: how/search.md
      - Multi-agent approach: how/multi-agent.md
  - TADA Lab:
